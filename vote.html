<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4ead6">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <title>Hall of Fame Vote - Sweat Squad</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="vote-page">
    <div class="vote-shell">
        <section class="hof-banner hof-banner-compact" aria-label="Hall of Fame">
            <div class="hof-banner-art" id="hofBannerLeft" aria-hidden="true"></div>
            <div class="hof-banner-copy">
                <h1>Hall of Fame</h1>
                <p>Sweat Squad 4 Life</p>
            </div>
            <div class="hof-banner-art hof-banner-art-right" id="hofBannerRight" aria-hidden="true"></div>
        </section>

        <div id="ballot">
            <p class="vote-hello">Loading your ballot…</p>
        </div>
    </div>

    <div id="voteBar" class="vote-bar" hidden>
        <span id="voteProgress">0 of 10 awards picked</span>
        <button type="button" id="submitVotes" disabled>Submit votes</button>
    </div>

    <noscript><p class="vote-hello">Turn on JavaScript to vote.</p></noscript>
    <script type="module" src="js/vote.js"></script>
</body>
</html>
