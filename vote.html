<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c1836">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <title>Hall of Fame Vote - Sweat Squad</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="vote-page">
    <div class="vote-shell">
        <section class="hof-banner hof-banner-compact" aria-label="Hall of Fame">
            <div class="hof-banner-art" aria-hidden="true">
                <svg viewBox="0 0 88 100"><defs><linearGradient id="voteCupL" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFF4C8"/><stop offset="55%" stop-color="#E2B340"/><stop offset="100%" stop-color="#8D6410"/></linearGradient></defs><path d="M20 28c-12 1-16 12-12 20 3 7 11 8 16 4" fill="none" stroke="url(#voteCupL)" stroke-width="4" stroke-linecap="round"/><path d="M68 28c12 1 16 12 12 20-3 7-11 8-16 4" fill="none" stroke="url(#voteCupL)" stroke-width="4" stroke-linecap="round"/><path d="M26 16h36v30c0 14-8 24-18 24S26 60 26 46V16z" fill="url(#voteCupL)"/><path d="M40 70h8v10h-8z" fill="url(#voteCupL)"/><path d="M30 80h28v6H30z" fill="url(#voteCupL)"/><path d="M24 86h40v6H24z" fill="url(#voteCupL)"/></svg>
            </div>
            <div class="hof-banner-copy">
                <h1>Hall of Fame</h1>
                <p>Sweat Squad 4 Life</p>
            </div>
            <div class="hof-banner-art hof-banner-art-right" aria-hidden="true">
                <svg viewBox="0 0 88 100"><defs><linearGradient id="voteMedalR" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFF4C8"/><stop offset="55%" stop-color="#E2B340"/><stop offset="100%" stop-color="#8D6410"/></linearGradient></defs><path d="M31 4h11l7 44H24z" fill="#b4232a"/><path d="M46 4h11l-5 44H40z" fill="#1d4e89"/><circle cx="44" cy="64" r="26" fill="url(#voteMedalR)"/><circle cx="44" cy="64" r="19.5" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2"/></svg>
            </div>
        </section>

        <div id="ballot">
            <p class="vote-hello">Loading your ballot…</p>
        </div>
    </div>

    <div id="voteBar" class="vote-bar" hidden>
        <span id="voteProgress">0 of 10 awards picked</span>
        <button type="button" id="submitVotes" disabled>Submit votes</button>
    </div>

    <noscript><p class="vote-hello">Turn on JavaScript to vote.</p></noscript>
    <script type="module" src="js/vote.js"></script>
</body>
</html>
