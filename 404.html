<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found</title>
    <script>
        (function () {
            var base = location.pathname.replace(/\/404\.html$/i, '/');
            if (base.charAt(base.length - 1) !== '/') base += '/';
            location.replace(base + 'index.html');
        })();
    </script>
</head>
<body>
    <p>Page not found. <a href="index.html">Go to Sweat Squad Stats</a></p>
</body>
</html>
