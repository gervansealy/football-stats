<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Squad Stats">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#1a237e">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <title>Game History - Football Database</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Football Season Player Database</div>
        <div class="nav-links">
            <a href="standings.html">Standings</a>
            <a href="game-history.html" class="active">Game History</a>
            <a href="team-selection.html">Team Selection</a>
            <a href="player-profiles.html">Player Profiles</a>
            <a href="settings.html" class="admin-only">Settings</a>
            <a href="recycle-bin.html" class="admin-only">Recycle Bin</a>
        </div>
        <div class="nav-actions">
            <span id="userRole" class="role-badge"></span>
            <button id="changeRoleBtn" class="btn-secondary">Change Role</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Game History</h1>
                <p class="subtitle">Click on any game to view details. Admins can edit or delete games.</p>
            </div>
            <div class="gh-filters">
                <select id="ghYearSelect" class="gh-select">
                    <option value="all">All Years</option>
                </select>
                <select id="ghMonthSelect" class="gh-select" disabled hidden>
                </select>
            </div>
        </div>

        <div id="gameHistoryContainer" class="game-history-grid">
            <p class="no-data">No games recorded yet</p>
        </div>
    </div>

    <!-- Game Detail Modal -->
    <div id="gameDetailModal" class="modal" onclick="if(event.target === this) closeGameDetailModal();">
        <div class="modal-content large">
            <div class="modal-header">
                <h2>Game Details</h2>
                <span class="close" onclick="closeGameDetailModal()">&times;</span>
            </div>
            <div id="gameDetailContent"></div>
        </div>
    </div>

    <!-- Edit Game Modal -->
    <div id="editGameModal" class="modal" onclick="if(event.target === this) closeEditGameModal();">
        <div class="modal-content large">
            <div class="modal-header">
                <h2>Edit Game</h2>
                <span class="close" onclick="closeEditGameModal()">&times;</span>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editGameId">
                <div class="form-group">
                    <label for="editGameDate">Game Date:</label>
                    <input type="date" id="editGameDate" class="form-input">
                </div>
                <h3>Player Stats</h3>
                <div id="editGameContent" class="player-stats-grid"></div>
                <button onclick="saveEditedGame()" class="btn-primary">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="js/pwa.js" defer></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/game-history.js"></script>
</body>
</html>
