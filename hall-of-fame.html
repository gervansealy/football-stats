<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Squad Stats">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#1a237e">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <title>Hall of Fame - Football Database</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Football Season Player Database</div>
        <div class="nav-links">
            <a href="standings.html">Standings</a>
            <a href="game-history.html">Game History</a>
            <a href="team-selection.html">Team Selection</a>
            <a href="player-profiles.html">Player Profiles</a>
            <a href="hall-of-fame.html" class="active">Hall of Fame</a>
            <a href="settings.html" class="admin-only">Settings</a>
            <a href="recycle-bin.html" class="admin-only">Recycle Bin</a>
        </div>
        <div class="nav-actions">
            <span id="userRole" class="role-badge"></span>
            <button id="changeRoleBtn" class="btn-secondary">Change Role</button>
        </div>
    </nav>

    <div class="container hof-page">
        <section class="hof-banner" aria-label="Hall of Fame">
            <div class="hof-banner-art" id="hofBannerLeft" aria-hidden="true"></div>
            <div class="hof-banner-copy">
                <h1>Hall of Fame</h1>
                <p>Sweat Squad 4 Life</p>
            </div>
            <div class="hof-banner-art hof-banner-art-right" id="hofBannerRight" aria-hidden="true"></div>
        </section>

        <div id="hofRoot">
            <p class="no-data">Loading Hall of Fame…</p>
        </div>
    </div>

    <noscript><p class="no-data">Turn on JavaScript to view the Hall of Fame.</p></noscript>

    <script src="js/pwa.js" defer></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/hall-of-fame.js"></script>
</body>
</html>
